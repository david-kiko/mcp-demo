apiVersion: v1
kind: ConfigMap
metadata:
  name: csv-analysis-config
  labels:
    app: csv-analysis
    auto-cleanup: "true"
data:
  code.py: |
    import os
    import json
    import csv
    import boto3
    from botocore.client import Config
    from botocore.exceptions import ClientError
    from collections import defaultdict
    from decimal import Decimal, InvalidOperation

    print("=== 数据分析任务开始 ===")
    
    # RustFS 配置
    RUSTFS_ENDPOINT = os.getenv('RUSTFS_ENDPOINT', 'http://192.168.248.41:9000')
    RUSTFS_USER = os.getenv('RUSTFS_USER', 'rustfsadmin')
    RUSTFS_PASS = os.getenv('RUSTFS_PASS', 'rustfsadmin')
    BUCKET_NAME = os.getenv('BUCKET_NAME', 'data')
    FILE_NAME = os.getenv('FILE_NAME', 'input.csv')
    
    print(f"RustFS 端点: {RUSTFS_ENDPOINT}")
    print(f"Bucket: {BUCKET_NAME}")
    print(f"文件名: {FILE_NAME}")
    
    # 下载 CSV 文件
    def download_csv(endpoint, bucket, filename, username, password):
        """从 RustFS (S3兼容) 下载 CSV 文件"""
        try:
            print(f"正在连接S3端点: {endpoint}")
            print(f"正在从bucket '{bucket}' 下载文件 '{filename}'...")
            
            # 创建S3客户端
            s3_client = boto3.client(
                's3',
                endpoint_url=endpoint,
                aws_access_key_id=username,
                aws_secret_access_key=password,
                config=Config(
                    signature_version='s3v4',
                    s3={'addressing_style': 'path'}
                ),
                region_name='us-east-1'
            )
            
            # 下载文件
            response = s3_client.get_object(Bucket=bucket, Key=filename)
            data = response['Body'].read()
            
            local_file = '/tmp/sales_data.csv'
            with open(local_file, 'wb') as f:
                f.write(data)
            print(f"文件下载成功，大小: {len(data)} 字节")
            return local_file
        except ClientError as e:
            error_code = e.response['Error']['Code']
            error_msg = e.response['Error']['Message']
            print(f"下载文件失败: S3错误 {error_code} - {error_msg}")
            raise
        except Exception as e:
            print(f"下载文件失败: {str(e)}")
            raise
    
    # 下载 CSV 文件
    csv_file = download_csv(RUSTFS_ENDPOINT, BUCKET_NAME, FILE_NAME, RUSTFS_USER, RUSTFS_PASS)
    
    # 读取并分析 CSV 数据
    print("\n=== 开始分析 CSV 数据 ===")
    
    # CSV 列名
    columns = [
        '顾客编号', '大类编码', '大类名称', '中类编码', '中类名称', 
        '小类编码', '小类名称', '销售日期', '销售月份', '商品编码', 
        '规格型号', '商品类型', '单位', '销售数量', '销售金额', 
        '商品单价', '是否促销'
    ]
    
    data_rows = []
    stats = {
        'total_records': 0,
        'total_sales_amount': Decimal('0'),
        'total_sales_quantity': Decimal('0'),
        'by_category': defaultdict(lambda: {'amount': Decimal('0'), 'quantity': Decimal('0'), 'count': 0}),
        'by_month': defaultdict(lambda: {'amount': Decimal('0'), 'quantity': Decimal('0'), 'count': 0}),
        'promotion_stats': {'promoted': 0, 'not_promoted': 0, 'promoted_amount': Decimal('0'), 'not_promoted_amount': Decimal('0')},
        'top_customers': defaultdict(lambda: Decimal('0')),
        'top_products': defaultdict(lambda: {'amount': Decimal('0'), 'quantity': Decimal('0')})
    }
    
    # 检测文件编码
    def detect_encoding(file_path):
        """尝试检测文件编码"""
        encodings_to_try = ['utf-8', 'gbk', 'gb2312', 'gb18030', 'big5', 'utf-16', 'latin1']
        
        # 先尝试使用chardet检测（如果可用）
        try:
            import chardet
            with open(file_path, 'rb') as f:
                raw_data = f.read(10000)  # 读取前10KB用于检测
                result = chardet.detect(raw_data)
                if result and result['encoding']:
                    detected_encoding = result['encoding'].lower()
                    if detected_encoding in encodings_to_try:
                        print(f"使用chardet检测到编码: {detected_encoding} (置信度: {result['confidence']:.2f})")
                        return detected_encoding
        except ImportError:
            print("chardet未安装，跳过自动检测")
        except Exception as e:
            print(f"chardet检测失败: {str(e)}")
        
        # 如果chardet不可用或检测失败，尝试常见编码
        print("尝试常见编码...")
        for encoding in encodings_to_try:
            try:
                with open(file_path, 'r', encoding=encoding) as f:
                    f.read(100)  # 尝试读取前100个字符
                print(f"成功使用编码: {encoding}")
                return encoding
            except (UnicodeDecodeError, UnicodeError):
                continue
            except Exception:
                continue
        
        # 如果所有编码都失败，返回utf-8并允许错误
        print("警告: 无法确定编码，使用utf-8并允许错误")
        return 'utf-8'
    
    # 检测并确定编码
    file_encoding = detect_encoding(csv_file)
    
    # 读取 CSV 文件
    with open(csv_file, 'r', encoding=file_encoding, errors='replace') as f:
        # 尝试检测编码
        try:
            reader = csv.DictReader(f)
            # 如果第一行是列名，使用它；否则使用预定义的列名
            if reader.fieldnames:
                actual_columns = list(reader.fieldnames)
                print(f"检测到列名: {actual_columns}")
            else:
                reader = csv.DictReader(f, fieldnames=columns)
                actual_columns = columns
        except Exception as e:
            # 如果读取失败，尝试使用预定义列名
            print(f"读取列名失败: {str(e)}，使用预定义列名")
            f.seek(0)
            reader = csv.DictReader(f, fieldnames=columns)
            actual_columns = columns
        
        for row_num, row in enumerate(reader, 1):
            try:
                # 跳过空行
                if not any(row.values()):
                    continue
                
                stats['total_records'] += 1
                
                # 解析数值字段
                try:
                    sales_amount = Decimal(str(row.get('销售金额', '0') or '0').replace(',', ''))
                    sales_quantity = Decimal(str(row.get('销售数量', '0') or '0').replace(',', ''))
                except (InvalidOperation, ValueError):
                    sales_amount = Decimal('0')
                    sales_quantity = Decimal('0')
                
                stats['total_sales_amount'] += sales_amount
                stats['total_sales_quantity'] += sales_quantity
                
                # 按大类统计
                category = row.get('大类名称', '未知')
                stats['by_category'][category]['amount'] += sales_amount
                stats['by_category'][category]['quantity'] += sales_quantity
                stats['by_category'][category]['count'] += 1
                
                # 按月份统计
                month = row.get('销售月份', '未知')
                stats['by_month'][month]['amount'] += sales_amount
                stats['by_month'][month]['quantity'] += sales_quantity
                stats['by_month'][month]['count'] += 1
                
                # 促销统计
                is_promotion = str(row.get('是否促销', '')).strip().lower()
                if '是' in is_promotion or 'yes' in is_promotion or '1' in is_promotion:
                    stats['promotion_stats']['promoted'] += 1
                    stats['promotion_stats']['promoted_amount'] += sales_amount
                else:
                    stats['promotion_stats']['not_promoted'] += 1
                    stats['promotion_stats']['not_promoted_amount'] += sales_amount
                
                # 客户统计
                customer_id = row.get('顾客编号', '')
                if customer_id:
                    stats['top_customers'][customer_id] += sales_amount
                
                # 商品统计
                product_code = row.get('商品编码', '')
                if product_code:
                    stats['top_products'][product_code]['amount'] += sales_amount
                    stats['top_products'][product_code]['quantity'] += sales_quantity
                
            except Exception as e:
                print(f"处理第 {row_num} 行时出错: {str(e)}")
                continue
    
    print(f"\n总记录数: {stats['total_records']}")
    print(f"总销售金额: {stats['total_sales_amount']:.2f}")
    print(f"总销售数量: {stats['total_sales_quantity']:.2f}")
    
    # 转换 Decimal 为字符串以便 JSON 序列化
    def decimal_to_str(obj):
        if isinstance(obj, Decimal):
            return str(obj)
        elif isinstance(obj, dict):
            return {k: decimal_to_str(v) for k, v in obj.items()}
        elif isinstance(obj, list):
            return [decimal_to_str(item) for item in obj]
        return obj
    
    # 生成分析结果
    result = {
        'summary': {
            'total_records': stats['total_records'],
            'total_sales_amount': str(stats['total_sales_amount']),
            'total_sales_quantity': str(stats['total_sales_quantity']),
            'average_amount_per_record': str(stats['total_sales_amount'] / stats['total_records'] if stats['total_records'] > 0 else Decimal('0'))
        },
        'by_category': {
            k: {
                'amount': str(v['amount']),
                'quantity': str(v['quantity']),
                'count': v['count']
            }
            for k, v in sorted(stats['by_category'].items(), key=lambda x: x[1]['amount'], reverse=True)[:10]
        },
        'by_month': {
            k: {
                'amount': str(v['amount']),
                'quantity': str(v['quantity']),
                'count': v['count']
            }
            for k, v in sorted(stats['by_month'].items())
        },
        'promotion_stats': {
            'promoted_count': stats['promotion_stats']['promoted'],
            'not_promoted_count': stats['promotion_stats']['not_promoted'],
            'promoted_amount': str(stats['promotion_stats']['promoted_amount']),
            'not_promoted_amount': str(stats['promotion_stats']['not_promoted_amount']),
            'promotion_rate': f"{(stats['promotion_stats']['promoted'] / stats['total_records'] * 100):.2f}%" if stats['total_records'] > 0 else "0%"
        },
        'top_customers': {
            k: str(v) for k, v in sorted(stats['top_customers'].items(), key=lambda x: x[1], reverse=True)[:10]
        },
        'top_products': {
            k: {
                'amount': str(v['amount']),
                'quantity': str(v['quantity'])
            }
            for k, v in sorted(stats['top_products'].items(), key=lambda x: x[1]['amount'], reverse=True)[:10]
        }
    }
    
    # 保存结果
    with open('/output/result.json', 'w', encoding='utf-8') as f:
        json.dump(result, f, indent=2, ensure_ascii=False)
    
    # 生成文本报告
    with open('/output/analysis_report.txt', 'w', encoding='utf-8') as f:
        f.write("=== 销售数据分析报告 ===\n\n")
        f.write(f"总记录数: {stats['total_records']}\n")
        f.write(f"总销售金额: {stats['total_sales_amount']:.2f}\n")
        f.write(f"总销售数量: {stats['total_sales_quantity']:.2f}\n")
        f.write(f"平均每笔金额: {stats['total_sales_amount'] / stats['total_records']:.2f}\n\n" if stats['total_records'] > 0 else "\n")
        
        f.write("=== 按大类统计（前10名）===\n")
        for cat, data in sorted(stats['by_category'].items(), key=lambda x: x[1]['amount'], reverse=True)[:10]:
            f.write(f"{cat}: 金额={data['amount']:.2f}, 数量={data['quantity']:.2f}, 笔数={data['count']}\n")
        
        f.write("\n=== 按月份统计 ===\n")
        for month, data in sorted(stats['by_month'].items()):
            f.write(f"{month}: 金额={data['amount']:.2f}, 数量={data['quantity']:.2f}, 笔数={data['count']}\n")
        
        f.write("\n=== 促销统计 ===\n")
        f.write(f"促销笔数: {stats['promotion_stats']['promoted']}\n")
        f.write(f"促销金额: {stats['promotion_stats']['promoted_amount']:.2f}\n")
        f.write(f"非促销笔数: {stats['promotion_stats']['not_promoted']}\n")
        f.write(f"非促销金额: {stats['promotion_stats']['not_promoted_amount']:.2f}\n")
        if stats['total_records'] > 0:
            f.write(f"促销率: {(stats['promotion_stats']['promoted'] / stats['total_records'] * 100):.2f}%\n")
        
        f.write("\n=== 前10名客户 ===\n")
        for customer, amount in sorted(stats['top_customers'].items(), key=lambda x: x[1], reverse=True)[:10]:
            f.write(f"{customer}: {amount:.2f}\n")
        
        f.write("\n=== 前10名商品 ===\n")
        for product, data in sorted(stats['top_products'].items(), key=lambda x: x[1]['amount'], reverse=True)[:10]:
            f.write(f"{product}: 金额={data['amount']:.2f}, 数量={data['quantity']:.2f}\n")
    
    print("\n=== 数据分析完成 ===")
    print("结果已保存到 /output/result.json 和 /output/analysis_report.txt")

  run.sh: |
    #!/bin/bash
    set -e

    echo "=== 数据分析任务开始 ==="
    echo "任务 ID: $TASK_ID"
    echo "工作目录: $(pwd)"
    echo "RustFS 端点: $RUSTFS_ENDPOINT"
    echo "Bucket: $BUCKET_NAME"
    echo "文件名: $FILE_NAME"
    echo ""
    echo "可用文件:"
    ls -la /task/

    echo ""
    echo "=== 检查并安装依赖 ==="
    # 检查boto3是否已安装，如果没有则安装
    if ! python3 -c "import boto3" 2>/dev/null; then
        echo "boto3未安装，正在安装..."
        pip install --quiet boto3
    else
        echo "boto3已安装"
    fi

    echo ""
    echo "=== 执行 Python 数据分析代码 ==="

    # 执行Python代码，捕获输出和错误
    python3 /task/code.py 2>&1 | tee /output/stdout_stderr.log

    # 记录退出状态
    EXIT_CODE=$?
    echo $EXIT_CODE > /output/exit_code.txt

    echo ""
    echo "=== 执行摘要 ==="

    # 复制所有生成的文件到输出目录
    cp -r /tmp/* /output/ 2>/dev/null || true

    echo "输出目录中的文件:"
    ls -la /output/

    # 显示结果文件内容
    if [ -f "/output/result.json" ]; then
        echo ""
        echo "=== 分析结果 (JSON) ==="
        cat /output/result.json
    fi

    if [ -f "/output/analysis_report.txt" ]; then
        echo ""
        echo "=== 分析报告 (文本) ==="
        cat /output/analysis_report.txt
    fi

    echo ""
    if [ $EXIT_CODE -eq 0 ]; then
        echo "=== 任务执行成功 ==="
    else
        echo "=== 任务执行失败，退出码: $EXIT_CODE ==="
    fi

---
apiVersion: batch/v1
kind: Job
metadata:
  name: csv-analysis-job-1763533656
  labels:
    app: csv-analysis
    auto-cleanup: "true"
spec:
  # Job 完成后 300 秒（5分钟）自动清理
  ttlSecondsAfterFinished: 300

  # 允许 0 次重试（一次性执行）
  backoffLimit: 0

  # 超时时间：10分钟（处理大文件可能需要更长时间）
  activeDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: csv-analysis
        auto-cleanup: "true"
    spec:
      restartPolicy: Never

      containers:
      - name: code-executor
        image: registry.opsman.top/kmai/python:3.12-alpine-data
        imagePullPolicy: Always
        command: ["/bin/sh", "/task/run.sh"]

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"

        env:
        - name: TASK_ID
          value: "csv-analysis-1763533656"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: RUSTFS_ENDPOINT
          value: "http://192.168.248.41:9000"
        - name: RUSTFS_USER
          value: "rustfsadmin"
        - name: RUSTFS_PASS
          value: "rustfsadmin"
        - name: BUCKET_NAME
          value: "data"
        - name: FILE_NAME
          value: "input.csv"

        volumeMounts:
        - name: task-data
          mountPath: /task
          readOnly: true
        - name: output-volume
          mountPath: /output

      volumes:
      - name: task-data
        configMap:
          name: csv-analysis-config
          defaultMode: 0755
      - name: output-volume
        emptyDir: {}
