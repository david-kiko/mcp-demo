<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图表测试</title>

    <!-- 简单样式 -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .chart-container {
            width: 100%;
            height: 400px;
            margin: 20px 0;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            position: relative;
        }

        .chart-title {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chart.js 图表测试</h1>

        <div id="chart-status" class="status loading">
            正在加载 Chart.js...
        </div>

        <div class="chart-title">销售数据 - 柱状图</div>
        <div class="chart-container">
            <canvas id="salesChart"></canvas>
        </div>

        <div class="chart-title">商品类别 - 饼图</div>
        <div class="chart-container">
            <canvas id="categoryChart"></canvas>
        </div>

        <div class="chart-title">月度趋势 - 折线图</div>
        <div class="chart-container">
            <canvas id="trendChart"></canvas>
        </div>
    </div>

    <!-- 使用稳定的Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

    <script>
        console.log('开始加载...');

        // 等待页面和脚本完全加载
        window.addEventListener('load', function() {
            console.log('页面加载完成');

            // 检查Chart.js是否加载
            setTimeout(function() {
                if (typeof Chart === 'undefined') {
                    document.getElementById('chart-status').className = 'status error';
                    document.getElementById('chart-status').textContent = 'Chart.js 加载失败！';
                    console.error('Chart.js not loaded');
                    return;
                }

                console.log('Chart.js 版本:', Chart.version);
                document.getElementById('chart-status').className = 'status success';
                document.getElementById('chart-status').textContent = 'Chart.js 加载成功！版本: ' + Chart.version;

                // 初始化图表
                initCharts();

            }, 1000); // 等待1秒确保Chart.js完全加载
        });

        function initCharts() {
            console.log('开始初始化图表...');

            try {
                // 销售数据柱状图
                const salesCtx = document.getElementById('salesChart');
                if (salesCtx) {
                    new Chart(salesCtx, {
                        type: 'bar',
                        data: {
                            labels: ['日配', '蔬果', '休闲', '粮油', '酒饮'],
                            datasets: [{
                                label: '销售额 (万元)',
                                data: [8.19, 8.14, 7.41, 6.09, 5.48],
                                backgroundColor: [
                                    'rgba(54, 162, 235, 0.8)',
                                    'rgba(255, 206, 86, 0.8)',
                                    'rgba(75, 192, 192, 0.8)',
                                    'rgba(153, 102, 255, 0.8)',
                                    'rgba(255, 159, 64, 0.8)'
                                ],
                                borderColor: [
                                    'rgba(54, 162, 235, 1)',
                                    'rgba(255, 206, 86, 1)',
                                    'rgba(75, 192, 192, 1)',
                                    'rgba(153, 102, 255, 1)',
                                    'rgba(255, 159, 64, 1)'
                                ],
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: '销售数据分析'
                                },
                                legend: {
                                    display: true,
                                    position: 'top'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '销售额 (万元)'
                                    }
                                }
                            }
                        }
                    });
                    console.log('销售图表初始化成功');
                }

                // 商品类别饼图
                const categoryCtx = document.getElementById('categoryChart');
                if (categoryCtx) {
                    new Chart(categoryCtx, {
                        type: 'pie',
                        data: {
                            labels: ['促销商品', '普通商品'],
                            datasets: [{
                                data: [6500, 36294],
                                backgroundColor: [
                                    'rgba(255, 99, 132, 0.8)',
                                    'rgba(54, 162, 235, 0.8)'
                                ],
                                borderColor: [
                                    'rgba(255, 99, 132, 1)',
                                    'rgba(54, 162, 235, 1)'
                                ],
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: '促销效果分析'
                                },
                                legend: {
                                    display: true,
                                    position: 'bottom'
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                            const percentage = ((context.parsed / total) * 100).toFixed(1);
                                            return context.label + ': ' + context.parsed.toLocaleString() + '笔 (' + percentage + '%)';
                                        }
                                    }
                                }
                            }
                        }
                    });
                    console.log('类别图表初始化成功');
                }

                // 月度趋势折线图
                const trendCtx = document.getElementById('trendChart');
                if (trendCtx) {
                    new Chart(trendCtx, {
                        type: 'line',
                        data: {
                            labels: ['2015年1月', '2015年2月', '2015年3月', '2015年4月'],
                            datasets: [{
                                label: '销售额 (万元)',
                                data: [11.69, 13.98, 9.41, 10.33],
                                borderColor: 'rgba(75, 192, 192, 1)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: '月度销售趋势'
                                },
                                legend: {
                                    display: true,
                                    position: 'top'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '销售额 (万元)'
                                    }
                                }
                            }
                        }
                    });
                    console.log('趋势图表初始化成功');
                }

                console.log('所有图表初始化完成');

            } catch (error) {
                console.error('图表初始化错误:', error);
                document.getElementById('chart-status').className = 'status error';
                document.getElementById('chart-status').textContent = '图表初始化错误: ' + error.message;
            }
        }

        // 监听错误
        window.addEventListener('error', function(e) {
            console.error('页面错误:', e.error);
        });
    </script>
</body>
</html>
