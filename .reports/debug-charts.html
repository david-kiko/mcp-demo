<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图表调试 - 销售业绩分析部分</title>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

    <!-- Font Awesome -->
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #006FEE;
        }

        .chart-wrapper {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .chart-container {
            width: 100%;
            height: 400px;
            margin: 10px 0;
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-title i {
            color: #006FEE;
        }

        .grid {
            display: grid;
            gap: 20px;
        }

        .grid-cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .loading::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #856404;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 销售业绩深度分析 - 专门测试</h1>

        <div id="status" class="status loading">
            <span class="inline"></span>正在初始化图表...
        </div>

        <!-- 问题区域：销售业绩深度分析 -->
        <section class="section-title">🎯 销售业绩深度分析 - 问题区域</section>

        <div class="grid grid-cols-2">
            <div class="chart-wrapper">
                <div class="chart-title">
                    <i class="fas fa-chart-bar"></i>
                    商品类别销售分布
                </div>
                <div class="chart-container" id="category-chart"></div>
            </div>

            <div class="chart-wrapper">
                <div class="chart-title">
                    <i class="fas fa-chart-line"></i>
                    月度销售趋势分析
                </div>
                <div class="chart-container" id="monthly-chart"></div>
            </div>
        </div>

        <div class="grid grid-cols-3">
            <div class="chart-wrapper">
                <div class="chart-title">
                    <i class="fas fa-tags"></i>
                    促销效果分析
                </div>
                <div class="chart-container" id="promotion-chart"></div>
            </div>

            <div class="chart-wrapper">
                <div class="chart-title">
                    <i class="fas fa-coins"></i>
                    价格区间分布
                </div>
                <div class="chart-container" id="price-chart"></div>
            </div>

            <div class="chart-wrapper">
                <div class="chart-title">
                    <i class="fas fa-fire"></i>
                    热销商品TOP5
                </div>
                <div class="chart-container" id="top-products">
                    <div style="padding: 20px; text-align: center;">
                        <p><strong>日配类商品</strong></p>
                        <p style="font-size: 18px; color: #006FEE; font-weight: bold;">¥81,932.46</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log('页面加载开始');

        let charts = {};

        // 等待Chart.js和页面完全加载
        window.addEventListener('load', function() {
            console.log('页面完全加载');

            setTimeout(function() {
                console.log('开始检查Chart.js...');

                if (typeof Chart === 'undefined') {
                    document.getElementById('status').className = 'status error';
                    document.getElementById('status').innerHTML = '<span class="inline"></span>❌ Chart.js 加载失败！';
                    console.error('Chart.js not loaded');
                    return;
                }

                console.log('✅ Chart.js 加载成功，版本:', Chart.version);
                document.getElementById('status').className = 'status success';
                document.getElementById('status').innerHTML = '<span class="inline"></span>✅ Chart.js v' + Chart.version + ' 加载成功！';

                // 初始化图表
                initCharts();

            }, 1000); // 延迟1秒确保完全加载
        });

        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.className = isError ? 'status error' : 'status loading';
            status.innerHTML = '<span class="inline"></span>' + message;
        }

        function initCharts() {
            console.log('🚀 开始初始化图表...');

            let initializedCharts = 0;
            const totalCharts = 4;

            // 1. 商品类别销售分布 - 柱状图
            try {
                const categoryCtx = document.getElementById('category-chart');
                console.log('📊 初始化类别图表，容器:', categoryCtx);

                if (categoryCtx) {
                    charts.category = new Chart(categoryCtx, {
                        type: 'bar',
                        data: {
                            labels: ['烘焙', '家电', '文体', '水产', '针织', '熟食', '家居', '冲调', '肉禽', '洗化', '酒饮', '粮油', '休闲', '蔬果', '日配'],
                            datasets: [{
                                label: '销售额 (万元)',
                                data: [0.01, 0.08, 0.20, 0.29, 0.57, 0.59, 0.63, 1.40, 2.52, 3.80, 5.48, 6.09, 7.41, 8.14, 8.19],
                                backgroundColor: 'rgba(0, 111, 238, 0.8)',
                                borderColor: 'rgba(0, 111, 238, 1)',
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: '商品类别销售分布',
                                    font: { size: 16 }
                                },
                                legend: {
                                    display: false
                                }
                            },
                            scales: {
                                x: {
                                    beginAtZero: true
                                },
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '销售额 (万元)'
                                    }
                                }
                            }
                        }
                    });
                    console.log('✅ 类别图表初始化成功');
                    initializedCharts++;
                } else {
                    console.error('❌ 类别图表容器未找到');
                }
            } catch (error) {
                console.error('❌ 类别图表初始化失败:', error);
                updateStatus('类别图表初始化失败: ' + error.message, true);
            }

            // 2. 月度销售趋势 - 折线图
            try {
                const monthlyCtx = document.getElementById('monthly-chart');
                console.log('📈 初始化趋势图表，容器:', monthlyCtx);

                if (monthlyCtx) {
                    charts.monthly = new Chart(monthlyCtx, {
                        type: 'line',
                        data: {
                            labels: ['2015年1月', '2015年2月', '2015年3月', '2015年4月'],
                            datasets: [{
                                label: '销售额 (万元)',
                                data: [11.69, 13.98, 9.41, 10.33],
                                borderColor: 'rgba(75, 192, 192, 1)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: 'rgba(75, 192, 192, 1)',
                                pointRadius: 5
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: '月度销售趋势分析',
                                    font: { size: 16 }
                                },
                                legend: {
                                    display: true,
                                    position: 'top'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '销售额 (万元)'
                                    }
                                }
                            }
                        }
                    });
                    console.log('✅ 趋势图表初始化成功');
                    initializedCharts++;
                } else {
                    console.error('❌ 趋势图表容器未找到');
                }
            } catch (error) {
                console.error('❌ 趋势图表初始化失败:', error);
                updateStatus('趋势图表初始化失败: ' + error.message, true);
            }

            // 3. 促销效果分析 - 环形图
            try {
                const promotionCtx = document.getElementById('promotion-chart');
                console.log('🎯 初始化促销图表，容器:', promotionCtx);

                if (promotionCtx) {
                    charts.promotion = new Chart(promotionCtx, {
                        type: 'doughnut',
                        data: {
                            labels: ['促销订单', '普通订单'],
                            datasets: [{
                                data: [6500, 36294],
                                backgroundColor: [
                                    'rgba(255, 179, 0, 0.8)',
                                    'rgba(0, 111, 238, 0.8)'
                                ],
                                borderColor: [
                                    'rgba(255, 179, 0, 1)',
                                    'rgba(0, 111, 238, 1)'
                                ],
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: '促销效果分析',
                                    font: { size: 16 }
                                },
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                    console.log('✅ 促销图表初始化成功');
                    initializedCharts++;
                } else {
                    console.error('❌ 促销图表容器未找到');
                }
            } catch (error) {
                console.error('❌ 促销图表初始化失败:', error);
                updateStatus('促销图表初始化失败: ' + error.message, true);
            }

            // 4. 价格区间分布 - 饼图
            try {
                const priceCtx = document.getElementById('price-chart');
                console.log('💰 初始化价格图表，容器:', priceCtx);

                if (priceCtx) {
                    charts.price = new Chart(priceCtx, {
                        type: 'pie',
                        data: {
                            labels: ['低价商品 (<10元)', '中价商品 (10-50元)', '高价商品 (≥50元)'],
                            datasets: [{
                                data: [15.72, 20.95, 8.73],
                                backgroundColor: [
                                    'rgba(0, 200, 81, 0.8)',
                                    'rgba(255, 179, 0, 0.8)',
                                    'rgba(247, 37, 133, 0.8)'
                                ],
                                borderColor: [
                                    'rgba(0, 200, 81, 1)',
                                    'rgba(255, 179, 0, 1)',
                                    'rgba(247, 37, 133, 1)'
                                ],
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: '价格区间分布',
                                    font: { size: 16 }
                                },
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                    console.log('✅ 价格图表初始化成功');
                    initializedCharts++;
                } else {
                    console.error('❌ 价格图表容器未找到');
                }
            } catch (error) {
                console.error('❌ 价格图表初始化失败:', error);
                updateStatus('价格图表初始化失败: ' + error.message, true);
            }

            // 检查初始化结果
            setTimeout(function() {
                console.log('🔍 图表初始化检查完成');
                console.log('📊 初始化的图表数量:', initializedCharts);
                console.log('📊 charts对象:', Object.keys(charts));

                if (initializedCharts === totalCharts) {
                    document.getElementById('status').className = 'status success';
                    document.getElementById('status').innerHTML = '<span class="inline"></span>🎉 所有 ' + totalCharts + ' 个图表初始化成功！';
                } else {
                    document.getElementById('status').className = 'status error';
                    document.getElementById('status').innerHTML = '<span class="inline"></span>⚠️ 只有 ' + initializedCharts + '/' + totalCharts + ' 个图表初始化成功';
                }

                // 验证图表是否正确显示
                setTimeout(function() {
                    Object.keys(charts).forEach((chartName, index) => {
                        const chart = charts[chartName];
                        console.log(`🔍 验证图表 ${index + 1}:`, chartName, '容器:', chart.canvas ? '存在' : '不存在');

                        if (chart.canvas) {
                            console.log(`   Canvas尺寸: ${chart.canvas.width}x${chart.canvas.height}`);
                            console.log(`   数据集数量: ${chart.data.datasets.length}`);
                        }
                    });
                }, 500);

            }, 2000);
        }

        // 错误监听
        window.addEventListener('error', function(e) {
            console.error('💥 页面错误:', e.error);
            updateStatus('页面错误: ' + e.error.message, true);
        });

        console.log('📄 页面加载完成，等待Chart.js...');
    </script>
</body>
</html>
